<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around The U.S.</title>
    <link href="./page/index.css" rel="stylesheet" />
  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          alt="Logotipo Around The U.S."
          class="logo header__logo"
          src="./images/logo.svg"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <button
            aria-label="Editar avatar"
            class="profile__edit-avatar-button"
            type="button"
          >
            <img class="profile__image" src="" alt="Avatar" />
          </button>
          <div class="profile__info">
            <h1 class="profile__title"></h1>
            <button
              aria-label="Editar perfil"
              class="profile__edit-button"
              type="button"
            ></button>
            <p class="profile__description"></p>
          </div>
          <button
            aria-label="Agregar tarjeta"
            class="profile__add-button"
            type="button"
          ></button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list"></ul>
          <!-- Template de las tarjetas -->
          <template id="card__template">
            <li class="card">
              <img class="card__image" src="" alt="" />
              <button
                aria-label="Eliminar tarjeta"
                class="card__delete-button"
                type="button"
              ></button>
              <div class="card__description">
                <h2 class="card__title"></h2>
                <button
                  aria-label="Botón Me gusta"
                  class="card__like-button"
                  type="button"
                ></button>
              </div>
            </li>
          </template>
          <!-- ----------------- -->
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">© 2025 Around The U.S.</p>
      </footer>
      <!-- POPUPS -->
      <!-- Popups para editar Nombre y Descripcion-->
      <div class="popup" id="edit-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Editar perfil</h3>
          <form class="popup__form" id="edit-profile-form">
            <!-- El campo "Nombre" debe contener entre 2 y 40 caracteres. -->
            <input
              class="popup__input popup__input_type_name"
              name="name"
              id="name"
              placeholder="Nombre"
              type="text"
              minlength="2"
              maxlength="40"
              required
            />
            <!-- Mensaje de error nombre-->
            <span class="name-input-error popup__input-error"></span>
            <!-- El campo "Acerca de" debe contener entre 2 y 200 caracteres. -->
            <input
              class="popup__input popup__input_type_description"
              name="description"
              id="description"
              placeholder="Acerca de mí"
              type="text"
              minlength="2"
              maxlength="200"
              required
            />
            <!-- Mensaje de error description-->
            <span class="description-input-error popup__input-error"></span>
            <button class="popup__button" type="submit" disabled>
              Guardar
            </button>
          </form>
        </div>
      </div>
      <!-- Popups para Agregar una nueva Card-->
      <div class="popup" id="new-card-popup">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Nuevo lugar</h3>
          <form class="popup__form" id="new-card-form">
            <!-- El campo "Nombre" debe contener entre 2 y 30 caracteres. -->
            <input
              class="popup__input popup__input_type_card-name"
              name="place-name"
              id="place-name"
              placeholder="Título"
              type="text"
              minlength="2"
              maxlength="30"
              required
            />
            <!-- Mensaje de error nombre de la tarjeta -->
            <span class="place-name-input-error popup__input-error"></span>
            <input
              class="popup__input popup__input_type_url"
              name="link"
              id="link"
              placeholder="Enlace a la imagen"
              type="url"
              required
            />
            <!-- Mensaje de error URL-->
            <span class="link-input-error popup__input-error"></span>
            <button class="popup__button" type="submit" disabled>Crear</button>
          </form>
        </div>
      </div>
      <!-- Popups para abrir la imagen de cada Card-->
      <div class="popup" id="image-popup">
        <div class="popup__content popup__content_image">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <img alt="" class="popup__image" src="#" />
          <p class="popup__caption"></p>
        </div>
      </div>
      <!-- Popups para de confirmacion (Eliminar tarjeta)-->
      <div class="popup" id="type-confirm-popup">
        <div class="popup__content popup__type_confirm">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">¿Estás seguro?</h3>
          <button class="popup__button popup__confirm_button" type="button">
            Sí
          </button>
        </div>
      </div>
      <!-- Popups para editar la foto de perfil-->
      <div class="popup" id="edit-avatar-popup">
        <div class="popup__content popup__content_avatar">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title">Cambiar foto de perfil</h3>
          <form class="popup__form" id="edit-avatar-form">
            <input
              class="popup__input popup__input_type_avatar"
              name="avatar"
              id="avatar"
              placeholder="Enlace de la imagen"
              type="url"
              required
            />
            <!-- Mensaje de error Avatar-->
            <span class="avatar-input-error popup__input-error"></span>
            <button class="popup__button" type="submit" disabled>
              Guardar
            </button>
          </form>
        </div>
      </div>
    </div>
    <!-- Scripts -->
    <script type="module" src="./page/index.js"></script>
  </body>
</html>
